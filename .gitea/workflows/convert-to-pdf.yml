name: PDF

on:
  workflow_dispatch:
  push:
    push:
    paths:
      - '.gitea/workflows/convert-to-pdf.yml'
      - 'README.md'

jobs:
  pdf:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set outputs
        id: git_info
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: "Print Git Info to file"
        run: |
          sed -i "s,<div style=\"display:none;\">&raquo; Commit Sha: ##COMMIT_SHA%%</div>,\&raquo; Commit Sha: ${{ steps.git_info.outputs.sha_short }},g" README.md

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Install markdown-pdf
        run: pip install markdown-pdf

      - name: PDF Generation
        run: python3 utils/makeresume.py README.md leonardo_amaral_resume.pdf

      - name: Release
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: Curriculo em PDF
          path: leonardo_amaral_resume.pdf
