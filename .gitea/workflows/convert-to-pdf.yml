name: PDF

on:
  workflow_dispatch:
  push:
    branches:
      - resume
    paths:
      - '.gitea/workflows/convert-to-pdf.yml'
      - 'README.md'

jobs:
  pdf:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PDF Generation
        uses: leleobhz/markdown-to-pdf@main
        with:
          input_dir: ./
          output_dir: ./
          build_html: false
      - name: Rename PDF
        run: mv README.pdf leonardo_amaral_resume.pdf
      - name: Release
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: Curriculo em PDF
          path: leonardo_amaral_resume.pdf
